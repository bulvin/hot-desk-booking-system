name: hot_desk_booking

services:
  web-api:
    image: ${DOCKER_REGISTRY-}web.api
    container_name: web.api
    pull_policy: build
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/Web.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  postgres:
    image: postgres:18
    restart: unless-stopped
    container_name: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB: hot_desk_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./.containers/postgres:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["--config-file=/run/secrets/keycloak.conf", "start"]
    restart: unless-stopped
    container_name: keycloak
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
    secrets:
      - source: keycloak_config
        target: keycloak.conf


secrets:
  postgres_password:
    file: ./.secrets/postgres_password.txt
  keycloak_config:
    file: ./.secrets/keycloak.conf
