name: hot_desk_booking

services:
  web-api:
    image: ${DOCKER_REGISTRY-}web.api
    pull_policy: build
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/Web.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB: hot_desk_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./.containers/postgres:/var/lib/postgresql

secrets:
  postgres_password:
    file: ./.secrets/postgres_password.txt
