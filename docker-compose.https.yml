services:
  web-api:
    environment:
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/hotdesk.pfx
    ports:
      - "8081:8081"
    volumes:
      - type: bind
        source: ./.https/hotdesk.pfx
        target: /https/hotdesk.pfx
        read_only: true
        bind:
          create_host_path: false
